- ClientId: "local-test-client"
  ClientSecrets:
    - "local-mock-secret"
  AllowedGrantTypes: ["authorization_code", "password"]
  RequirePkce: false
  RedirectUris:
    [
      "http://localhost:3000",
      "http://localhost:3000/auth/callback",
      "http://localhost:3000/auth/sign-out",
      "http://localhost:3000/account/signed-out",
    ]
  AllowedScopes:
    - "openid"
    - "profile"
    - "email"
    - "local-test-client"
    - "api://local-test-client/forms.user"
  AllowOfflineAccess: true
  AllowAccessTokensViaBrowser: true
  AccessTokenType: "Jwt"
  AlwaysSendClientClaims: true
  ClientClaimsPrefix: ""
  Claims:
    - Type: "login_hint"
      Value: ""
    - Type: "aud"
      Value: "local-test-client"
