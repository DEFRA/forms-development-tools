services:
  forms-designer:
    image: defradigital/forms-designer:${FORMS_DESIGNER_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-designer
    environment:
      ENVIRONMENT: local
      NODE_ENV: production
      PORT: 3000
      # Public base URL for links generated by the app (browser-visible)
      APP_BASE_URL: http://localhost:3000
      # Service-to-service URLs
      AUDIT_URL: http://host.docker.internal:3003
      MANAGER_URL: http://host.docker.internal:3001
      SUBMISSION_URL: http://host.docker.internal:3002
      ENTITLEMENT_URL: http://host.docker.internal:3004
      NOTIFY_URL: http://host.docker.internal:3006
      SHAREPOINT_URL: http://host.docker.internal:3007
      FILE_DOWNLOAD_PASSWORD_TTL: 1233455
      SESSION_COOKIE_TTL: 86400000
      IS_SECURE_OVERRIDE: false
      # Runner preview URL used by browser links
      PREVIEW_URL: http://localhost:3009
      # Redis/session
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: forms-designer
      SESSION_COOKIE_PASSWORD: 948ltmkivpetvv9j673i38c81rlc8nu5
      SESSION_TTL: 2419200000
      # OIDC/Azure (override in .env for real credentials)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      OIDC_WELL_KNOWN_CONFIGURATION_URL: ${OIDC_WELL_KNOWN_CONFIGURATION_URL}
      FEATURE_FLAG_ALLOW_PAYMENTS: ${FEATURE_FLAG_ALLOW_PAYMENTS:-true}
      FEATURE_FLAG_ALLOW_GEOSPATIAL: ${FEATURE_FLAG_ALLOW_GEOSPATIAL:-true}
      # SNS
      SNS_ENDPOINT: http://host.docker.internal:4566
      SNS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:forms_designer_events
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ORDNANCE_SURVEY_API_KEY: test
      ORDNANCE_SURVEY_API_SECRET: test
    ports:
      - '3000:3000'
    depends_on:
      - forms-manager
      - redis
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'localhost:host-gateway'

  forms-manager:
    image: defradigital/forms-manager:${FORMS_MANAGER_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-manager
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: '0.0.0.0'
      SERVICE_VERSION: ''
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-manager
      # OIDC (override for your IdP)
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-https://example.invalid/jwks.json}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD:-forms-manager}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS:-https://example.invalid/}
      # Entitlement API
      ENTITLEMENT_URL: http://host.docker.internal:3004
      # Events/storage (Localstack)
      FORM_DEF_BUCKET_NAME: form-definition-storage
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # SNS topic used for publishing events
      SNS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:forms_manager_events
      SNS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      S3_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      TRACE_HEADER: x-trace-id
      LOG_ENABLED: true
      LOG_LEVEL: info
      LOG_FORMAT: 'pino-pretty'
      HTTP_PROXY: ''
      CDP_HTTPS_PROXY: ''
      ENABLE_SECURE_CONTEXT: false
      ENABLE_METRICS: false
      FEATURE_FLAG_PUBLISH_AUDIT_EVENTS: ${FEATURE_FLAG_PUBLISH_AUDIT_EVENTS:-false}
      # PUBLIC key for secrets is a test value - do not use for any deployments
      PUBLIC_KEY_FOR_SECRETS: ""
    ports:
      - '3001:3001'
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      mongo:
        condition: service_healthy

  forms-runner:
    image: defradigital/forms-runner:${FORMS_RUNNER_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-runner
    environment:
      HOST: '0.0.0.0'
      ENVIRONMENT: local
      ENFORCE_CSRF: true
      SERVICE_VERSION: local-dev
      PHASE_TAG: beta
      NODE_ENV: development
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORT: 3009
      SESSION_TIMEOUT: 86400000
      CONFIRMATION_SESSION_TIMEOUT: 1200000
      # Public base URL for links
      BASE_URL: http://localhost:3009
      # Service URLs
      MANAGER_URL: http://host.docker.internal:3001
      DESIGNER_URL: http://host.docker.internal:3000
      SUBMISSION_URL: http://host.docker.internal:3002
      # Redis/session
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: forms-runner
      USE_SINGLE_INSTANCE_CACHE: true
      SESSION_COOKIE_PASSWORD: ${RUNNER_SESSION_COOKIE_PASSWORD}
      SESSION_TTL: 86400000
      # Optional analytics/notify/uploader
      GA_TRACKING_ID: ${GA_TRACKING_ID:-}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      ORDNANCE_SURVEY_API_KEY: ${ORDNANCE_SURVEY_API_KEY:-dummy}
      ORDNANCE_SURVEY_API_SECRET: ${ORDNANCE_SURVEY_API_SECRET:-dummy}
      NOTIFY_TEMPLATE_ID: '3d448938-8a8b-40c2-a3de-414597f976e1'
      FEEDBACK_LINK: 'http://test.com'
      UPLOADER_URL: http://uploader.127.0.0.1.sslip.io:7300
      UPLOADER_BUCKET_NAME: my-bucket
      TRACING_HEADER: x-trace-id
      LOG_ENABLED: true
      LOG_LEVEL: debug
      LOG_FORMAT: pino-pretty
      # Messaging
      AWS_REGION: eu-west-2
      SNS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      SNS_ADAPTER_TOPIC_ARN: "arn:aws:sns:eu-west-2:000000000000:forms_runner_submission_events"
      SNS_SAVE_TOPIC_ARN: "arn:aws:sns:eu-west-2:000000000000:forms_runner_events"
      SNS_FORM_TOPIC_ARN_MAP: '{"507f1f77bcf86cd799439099":"arn:aws:sns:eu-west-2:000000000000:form-specific-topic"}'
      # PRIVATE key for secrets is a test value - do not use for any deployments
      PRIVATE_KEY_FOR_SECRETS: ""
      STAGING_PREFIX: staging
      SERVICE_BANNER_TEXT: ''
      GOOGLE_TAG_MANAGER_CONTAINER_ID: ''
      GOOGLE_ANALYTICS_CONTAINER_ID: 'abcd'
      SAVE_AND_EXIT_EXPIRY_IN_DAYS: 28
      STORE_COMPLETED_APPLICATIONS_FOR: '9 months'
      STORE_FEEDBACK_FOR: '9 months'
      USE_MAPS_FEATURE: true
      FEEDBACK_VIA_EMAIL: defraforms@defra.gov.uk
    ports:
      - '3009:3009'
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'cdp.127.0.0.1.sslip.io:host-gateway'
      - 'uploader.127.0.0.1.sslip.io:host-gateway'
    depends_on:
      - forms-submission-api
      - forms-entitlement-api
      - forms-manager
      - redis

  forms-submission-api:
    image: defradigital/forms-submission-api:${FORMS_SUBMISSION_API_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-submission-api
    environment:
      HOST: 0.0.0.0
      ENVIRONMENT: local
      NODE_ENV: development
      SERVICE_VERSION: ''
      PORT: 3002
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-submission-api
      # S3 via Localstack
      S3_BUCKET: my-bucket
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      SQS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      SAVE_AND_EXIT_QUEUE_URL: http://${LOCALSTACK_HOST:-host.docker.internal}:4566/000000000000/forms_submission_events
      SUBMISSION_QUEUE_URL: http://${LOCALSTACK_HOST:-host.docker.internal}:4566/000000000000/forms_submission
      FORM_SUBMISSIONS_SQS_DLQ_ARN: 'arn:aws:sqs:eu-west-2:000000000000:forms_submission-deadletter'
      SAVE_AND_EXIT_SQS_DLQ_ARN: 'arn:aws:sqs:eu-west-2:000000000000:forms_submission_events-deadletter'
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS}
      TRACING_HEADER: x-trace-id
      LOG_ENABLED: true
      LOG_FORMAT: pino-pretty
      LOG_LEVEL: info
      CDP_HTTPS_PROXY: ''
      ENABLE_METRICS: false
      ENABLE_SECURE_CONTEXT: false
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      NOTIFY_TEMPLATE_ID: ${NOTIFY_TEMPLATE_ID}
      NOTIFY_REPLY_TO_ID: ${NOTIFY_REPLY_TO_ID}
      DESIGNER_URL: http://localhost:3000
      MANAGER_URL: http://host.docker.internal:3001
      ENTITLEMENT_URL: http://host.docker.internal:3004
      COGNITO_JWKS_URI: ${OIDC_JWKS_URI}
      COGNITO_CLIENT_IDS: '{}'
      COGNITO_VERIFY_ISS: dummy
      LOADED_PREFIX: prefix
      RECEIVE_MESSAGE_TIMEOUT_MS: 5000
      SQS_MAX_NUMBER_OF_MESSAGES: 10
      SQS_VISIBILITY_TIMEOUT: 1
      SAVE_AND_EXIT_EXPIRY_IN_DAYS: 28
      EMAIL_USERS_EXPIRING_SOON_SAVED_FOR_LATER_LINK_ENABLED: false
      EMAIL_USERS_EXPIRING_SOON_SAVED_FOR_LATER_LINK_CRON: '0 3 * * *'
      EMAIL_USERS_EXPIRING_SOON_SAVED_FOR_LATER_LINK_EXPIRY_WINDOW_HOURS: 8
      EMAIL_USERS_EXPIRING_SOON_SAVED_FOR_LATER_LINK_MINIMUM_HOURS_REMAINING: 4
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3002:3002'
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy

  forms-entitlement-api:
    image: defradigital/forms-entitlement-api:${FORMS_ENTITLEMENT_API_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-entitlement-api
    environment:
      HOST: 0.0.0.0
      ENVIRONMENT: local
      NODE_ENV: production
      PORT: 3004
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-entitlement-api
      # OIDC
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      # Azure Graph (override with real values if syncing from AAD)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      SYNC_ADMIN_USERS_ENABLED: ${SYNC_ADMIN_USERS_ENABLED:-false}
      SYNC_ADMIN_USERS_CRON: '0 3 * * *'
      TRACING_HEADER: x-trace-id
      LOG_ENABLED: true
      LOG_FORMAT: pino-pretty
      LOG_LEVEL: info
      CDP_HTTPS_PROXY: ''
      ENABLE_METRICS: false
      ENABLE_SECURE_CONTEXT: false
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      SNS_TOPIC_ARN: "arn:aws:sns:eu-west-2:000000000000:forms_entitlement_events"
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3004:3004'
    depends_on:
      mongo:
        condition: service_healthy

  forms-audit-api:
    image: defradigital/forms-audit-api:${FORMS_AUDIT_API_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-audit-api
    environment:
      HOST: 0.0.0.0
      ENVIRONMENT: local
      NODE_ENV: development
      PORT: 3003
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-audit-api
      # SQS via Localstack (queue subscribed to SNS topic)
      AWS_REGION: eu-west-2
      SQS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      EVENTS_SQS_QUEUE_URL: http://${LOCALSTACK_HOST:-host.docker.internal}:4566/000000000000/forms_audit_events
      ENTITLEMENT_URL: http://host.docker.internal:3004
      EVENTS_SQS_DLQ_ARN: 'arn:aws:sqs:eu-west-2:000000000000:forms_audit_events-deadletter'
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RECEIVE_MESSAGE_TIMEOUT_MS: 5000
      SQS_MAX_NUMBER_OF_MESSAGES: 10
      SQS_VISIBILITY_TIMEOUT: 1
      TRACING_HEADER: x-trace-id
      LOG_ENABLED: true
      LOG_FORMAT: pino-pretty
      LOG_LEVEL: info
      CDP_HTTPS_PROXY: ''
      # OIDC
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS}
      ENABLE_METRICS: false
      ENABLE_SECURE_CONTEXT: false
      CACHE_ENABLED: false
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3003:3003'
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy

  forms-notify-listener:
    image: defradigital/forms-notify-listener:${FORMS_NOTIFY_LISTENER_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-notify-listener
    environment:
      HOST: 0.0.0.0
      ENVIRONMENT: local
      NODE_ENV: development
      PORT: 3006
      # SQS via Localstack (queue subscribed to SNS topic)
      AWS_REGION: eu-west-2
      SQS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      EVENTS_SQS_QUEUE_URL: http://${LOCALSTACK_HOST:-host.docker.internal}:4566/000000000000/forms_notify_listener_events
      EVENTS_SQS_DLQ_ARN: 'arn:aws:sqs:eu-west-2:000000000000:forms_notify_listener_events-deadletter'
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TRACING_HEADER: x-trace-id
      LOG_LEVEL: info
      CDP_HTTPS_PROXY: ''
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      NOTIFY_TEMPLATE_ID: '3d448938-8a8b-40c2-a3de-414597f976e1'
      NOTIFY_REPLY_TO_ID: 'c0428382-7df0-4e57-89fa-20bb69e9e755'
      DESIGNER_URL: http://localhost:3000
      MANAGER_URL: http://host.docker.internal:3001
      ENTITLEMENT_URL: http://host.docker.internal:3004
      RECEIVE_MESSAGE_TIMEOUT_MS: 5000
      SQS_MAX_NUMBER_OF_MESSAGES: 10
      SQS_VISIBILITY_TIMEOUT: 1
      FILE_EXPIRY_IN_MONTHS: 9
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3006:3006'
    depends_on:
      localstack:
        condition: service_healthy

  forms-sharepoint-listener:
    image: defradigital/forms-sharepoint-listener:${FORMS_SHAREPOINT_LISTENER_TAG:-latest}
    platform: linux/amd64
    profiles:
      - forms-sharepoint-listener
    environment:
      NODE_ENV: development
      PORT: 3007
      # SQS via Localstack (queue subscribed to SNS topic)
      AWS_REGION: eu-west-2
      SQS_ENDPOINT: http://${LOCALSTACK_HOST:-host.docker.internal}:4566
      EVENTS_SQS_QUEUE_URL: http://${LOCALSTACK_HOST:-host.docker.internal}:4566/000000000000/forms_sharepoint_listener_events
      EVENTS_SQS_DLQ_ARN: 'arn:aws:sqs:eu-west-2:000000000000:forms_sharepoint_listener_events-deadletter'
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
      RECEIVE_MESSAGE_TIMEOUT_MS: 5000
      SHAREPOINT_TENANT_ID: ${SHAREPOINT_TENANT_ID:-6f504113-6b64-43f2-ade9-242e05780007}
      SHAREPOINT_CLIENT_ID: ${SHAREPOINT_CLIENT_ID:-dummy}
      SHAREPOINT_CLIENT_SECRET: ${SHAREPOINT_CLIENT_SECRET:-dummy}
      SHAREPOINT_FORM_MAPPINGS: ${SHAREPOINT_FORM_MAPPINGS:-{"mappings":[]}}
      MANAGER_URL: http://host.docker.internal:3001
      ENTITLEMENT_URL: http://host.docker.internal:3004
      # OIDC
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${OIDC_VERIFY_ISS}
    networks:
      - cdpuploader
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3007:3007'
    depends_on:
      localstack:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-test
    ports:
      - '127.0.0.1:8085:8080'
    command:
      [
        '--verbose',
        '--enable-browser-proxying'
      ]
    volumes:
      - ../test-harness/wiremock:/home/wiremock
    networks:
      - cdpuploader
    depends_on:
      localstack:
        condition: service_healthy

# No volumes or infra services here; provided by local-development-mock-auth/docker-compose.yml
