version: '3.9'

services:
  forms-designer:
    image: defradigital/forms-designer:${FORMS_DESIGNER_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3001
      # Public base URL for links generated by the app (browser-visible)
      APP_BASE_URL: http://localhost:3001
      # Service-to-service URLs
      MANAGER_URL: http://forms-manager:3002
      SUBMISSION_URL: http://forms-submission-api:3004
      # Runner preview URL used by browser links
      PREVIEW_URL: http://localhost:3003
      # Redis/session
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_SINGLE_INSTANCE_CACHE: 'false'
      SESSION_COOKIE_PASSWORD: 948ltmkivpetvv9j673i38c81rlc8nu5
      SESSION_TTL: 86400000
      # OIDC/Azure (override in .env for real credentials)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      OIDC_WELL_KNOWN_CONFIGURATION_URL: ${OIDC_WELL_KNOWN_CONFIGURATION_URL}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
    ports:
      - '3001:3001'
    depends_on:
      - forms-manager
      - redis

  forms-manager:
    image: defradigital/forms-manager:${FORMS_MANAGER_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3002
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-manager
      # OIDC (override for your IdP)
      OIDC_JWKS_URI: ${MANAGER_OIDC_JWKS_URI:-https://example.invalid/jwks.json}
      OIDC_AUDIENCE: ${MANAGER_OIDC_AUDIENCE:-forms-manager}
      OIDC_ISSUER: ${MANAGER_OIDC_ISSUER:-https://example.invalid/}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      # Entitlement API
      ENTITLEMENT_URL: http://forms-entitlement-api:3005
      FEATURE_FLAG_USE_ENTITLEMENT_API: 'true'
      # Events/storage (Localstack)
      AWS_REGION: eu-west-2
      SNS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: form-definition-storage
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # SNS topic used for publishing events
      SNS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:forms_manager_events
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3002:3002'
    depends_on:
      - mongo

  forms-runner:
    image: defradigital/forms-runner:${FORMS_RUNNER_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3003
      # Public base URL for links
      BASE_URL: http://localhost:3003
      # Service URLs
      MANAGER_URL: http://forms-manager:3002
      DESIGNER_URL: http://localhost:3001
      SUBMISSION_URL: http://forms-submission-api:3004
      # Redis/session
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_SINGLE_INSTANCE_CACHE: 'false'
      SESSION_COOKIE_PASSWORD: ${RUNNER_SESSION_COOKIE_PASSWORD}
      SESSION_TTL: 86400000
      # Optional analytics/notify/uploader
      GA_TRACKING_ID: ${GA_TRACKING_ID:-}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      UPLOADER_URL: http://cdp-uploader:7337
      UPLOADER_BUCKET: my-bucket
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3003:3003'
    depends_on:
      - forms-submission-api
      - forms-entitlement-api
      - forms-manager
      - redis

  forms-submission-api:
    image: defradigital/forms-submission-api:${FORMS_SUBMISSION_API_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3004
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-submission
      # S3 via Localstack
      S3_BUCKET: form-definition-storage
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OIDC_JWKS_URI: ${SUBMISSION_OIDC_JWKS_URI}
      OIDC_AUDIENCE: ${SUBMISSION_OIDC_AUDIENCE}
      OIDC_ISSUER: ${SUBMISSION_OIDC_ISSUER}
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3004:3004'
    depends_on:
      - mongo
      - localstack

  forms-entitlement-api:
    image: defradigital/forms-entitlement-api:${FORMS_ENTITLEMENT_API_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3005
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-entitlement
      # OIDC
      OIDC_JWKS_URI: ${ENTITLEMENT_OIDC_JWKS_URI}
      OIDC_AUDIENCE: ${ENTITLEMENT_OIDC_AUDIENCE}
      OIDC_ISSUER: ${ENTITLEMENT_OIDC_ISSUER}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      # Azure Graph (override with real values if syncing from AAD)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3005:3005'
    depends_on:
      - mongo

  forms-audit-api:
    image: defradigital/forms-audit-api:${FORMS_AUDIT_API_TAG:latest}
    environment:
      NODE_ENV: development
      PORT: 3006
      # Mongo
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-audit
      # SQS via Localstack (queue subscribed to SNS topic)
      AWS_REGION: eu-west-2
      SQS_ENDPOINT: http://localstack:4566
      EVENTS_SQS_QUEUE_URL: http://localstack:4566/000000000000/forms_audit_events
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3006:3006'
    depends_on:
      - mongo
      - localstack

# No volumes or infra services here; provided by local-development-dependencies/docker-compose.yml
