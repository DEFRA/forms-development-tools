services:
  forms-designer:
    image: defradigital/forms-designer:${FORMS_DESIGNER_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      # Public base URL for links generated by the app (browser-visible)
      APP_BASE_URL: http://localhost:3000
      # Service-to-service URLs
      MANAGER_URL: http://host.docker.internal:3001
      SUBMISSION_URL: http://host.docker.internal:3002
      ENTITLEMENT_URL: http://host.docker.internal:3004
      FILE_DOWNLOAD_PASSWORD_TTL: 1233455
      SESSION_COOKIE_TTL: 86400000
      IS_SECURE_OVERRIDE: false
      # Runner preview URL used by browser links
      PREVIEW_URL: http://localhost:3009
      # Redis/session
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: forms-designer
      SESSION_COOKIE_PASSWORD: 948ltmkivpetvv9j673i38c81rlc8nu5
      SESSION_TTL: 2419200000
      # OIDC/Azure (override in .env for real credentials)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      OIDC_WELL_KNOWN_CONFIGURATION_URL: ${OIDC_WELL_KNOWN_CONFIGURATION_URL}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      FEATURE_FLAG_USE_ENTITLEMENT_API: ${FEATURE_FLAG_USE_ENTITLEMENT_API}
      # SNS
      SNS_ENDPOINT: ${SNS_ENDPOINT}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '3000:3000'
    depends_on:
      - forms-manager
      - redis
    network_mode: host

  forms-manager:
    image: defradigital/forms-manager:${FORMS_MANAGER_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3001
      # Mongo
      MONGO_URI: mongodb://host.docker.internal:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-manager
      # OIDC (override for your IdP)
      OIDC_JWKS_URI: ${MANAGER_OIDC_JWKS_URI:-https://example.invalid/jwks.json}
      OIDC_VERIFY_AUD: ${MANAGER_OIDC_VERIFY_AUD:-forms-manager}
      OIDC_VERIFY_ISS: ${MANAGER_OIDC_VERIFY_ISS:-https://example.invalid/}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      # Entitlement API
      ENTITLEMENT_URL: http://host.docker.internal:3004
      FEATURE_FLAG_USE_ENTITLEMENT_API: ${FEATURE_FLAG_USE_ENTITLEMENT_API}
      # Events/storage (Localstack)
      AWS_REGION: eu-west-2
      SNS_ENDPOINT: http://host.docker.internal:4566
      S3_ENDPOINT: http://host.docker.internal:4566
      S3_BUCKET: form-definition-storage
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # SNS topic used for publishing events
      SNS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:forms_manager_events
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3001:3001'
    networks:
      - cdpuploader
    depends_on:
      mongo:
        condition: service_healthy

  forms-runner:
    image: defradigital/forms-runner:${FORMS_RUNNER_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3009
      # Public base URL for links
      BASE_URL: http://localhost:3009
      # Service URLs
      MANAGER_URL: http:/host.docker.internal:3001
      DESIGNER_URL: http://localhost:3000
      SUBMISSION_URL: http://host.docker.internal:3002
      # Redis/session
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: forms-runner
      USE_SINGLE_INSTANCE_CACHE: 'false'
      SESSION_COOKIE_PASSWORD: ${RUNNER_SESSION_COOKIE_PASSWORD}
      SESSION_TTL: 86400000
      # Optional analytics/notify/uploader
      GA_TRACKING_ID: ${GA_TRACKING_ID:-}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      NOTIFY_TEMPLATE_ID: '3d448938-8a8b-40c2-a3de-414597f976e1'
      FEEDBACK_LINK: 'http://test.com'
      UPLOADER_URL: http://cdp-uploader:7337
      UPLOADER_BUCKET: my-bucket
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    ports:
      - '3009:3009'
    networks:
      - cdpuploader
    depends_on:
      - forms-submission-api
      - forms-entitlement-api
      - forms-manager
      - redis

  forms-submission-api:
    image: defradigital/forms-submission-api:${FORMS_SUBMISSION_API_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3002
      # Mongo
      MONGO_URI: mongodb://host.docker.internal:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-submission
      # S3 via Localstack
      S3_BUCKET: form-definition-storage
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://host.docker.internal:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OIDC_JWKS_URI: ${SUBMISSION_OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${SUBMISSION_OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${SUBMISSION_OIDC_VERIFY_ISS}
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    networks:
      - cdpuploader
    ports:
      - '3002:3002'
    depends_on:
      - mongo
      - localstack

  forms-entitlement-api:
    image: defradigital/forms-entitlement-api:${FORMS_ENTITLEMENT_API_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3004
      # Mongo
      MONGO_URI: mongodb://host.docker.internal:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-entitlement
      # OIDC
      OIDC_JWKS_URI: ${ENTITLEMENT_OIDC_JWKS_URI}
      OIDC_VERIFY_AUD: ${ENTITLEMENT_OIDC_VERIFY_AUD}
      OIDC_VERIFY_ISS: ${ENTITLEMENT_OIDC_VERIFY_ISS}
      ROLE_EDITOR_GROUP_ID: ${ROLE_EDITOR_GROUP_ID}
      # Azure Graph (override with real values if syncing from AAD)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - cdpuploader
    ports:
      - '3004:3004'
    depends_on:
      mongo:
        condition: service_healthy

  forms-audit-api:
    image: defradigital/forms-audit-api:${FORMS_AUDIT_API_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3003
      # Mongo
      MONGO_URI: mongodb://host.docker.internal:27017/?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: forms-audit
      # SQS via Localstack (queue subscribed to SNS topic)
      AWS_REGION: eu-west-2
      SQS_ENDPOINT: http://host.docker.internal:4566
      EVENTS_SQS_QUEUE_URL: http://host.docker.internal:4566/000000000000/forms_audit_events
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TRACE_HEADER: x-trace-id
      LOG_LEVEL: info
    networks:
      - cdpuploader
    ports:
      - '3003:3003'
    depends_on:
      - mongo
      - localstack

# No volumes or infra services here; provided by local-development-mock-auth/docker-compose.yml
